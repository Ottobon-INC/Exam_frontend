version: '3.8'

services:
  frontend:
    build:
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:4010/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:4010/proctoring}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    image: exam-frontend
    container_name: exam-frontend
    restart: unless-stopped
    ports:
      - "5050:80"
    # We do NOT need to link it to the backend container's network
    # because the Vue application runs in the user's browser, 
    # which will connect to the backend over the public internet (port 4000).
    env_file:
      - .env
    network_mode: bridge
